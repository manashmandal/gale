name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release type (auto uses CalVer YYYY.MM.DD)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: gale
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Generate CalVer tag
        if: github.event_name == 'workflow_dispatch'
        id: calver
        run: |
          # Generate CalVer version: vYYYY.MMDD.PATCH (semver compatible: 3 parts)
          YEAR=$(date +%Y)
          MMDD=$(date +%m%d)
          BASE_VERSION="v${YEAR}.${MMDD}"

          # Check if this version already exists and find next patch
          EXISTING=$(git tag -l "${BASE_VERSION}.*" | sort -V | tail -1)

          if [ -z "$EXISTING" ]; then
            VERSION="${BASE_VERSION}.0"
          else
            # Extract patch number (e.g., v2025.1227.1 -> 1)
            PATCH=$(echo "$EXISTING" | sed "s/${BASE_VERSION}\.//" | sed 's/^$/0/')
            NEXT_PATCH=$((PATCH + 1))
            VERSION="${BASE_VERSION}.${NEXT_PATCH}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.calver.outputs.version }}" -m "Release ${{ steps.calver.outputs.version }}"
          git push origin "${{ steps.calver.outputs.version }}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Get version (strip 'v' prefix for formula version)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ steps.calver.outputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"

          # Download checksums
          curl -sL "https://api.github.com/repos/manashmandal/gale/releases/tags/${TAG}" \
            -H "Authorization: token $GITHUB_TOKEN" | \
            jq -r '.assets[] | select(.name == "checksums.txt") | .id' | \
            xargs -I {} curl -sL "https://api.github.com/repos/manashmandal/gale/releases/assets/{}" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" > checksums.txt

          # Extract SHA256 values
          SHA_DARWIN_AMD64=$(grep "darwin_amd64" checksums.txt | awk '{print $1}')
          SHA_DARWIN_ARM64=$(grep "darwin_arm64" checksums.txt | awk '{print $1}')
          SHA_LINUX_AMD64=$(grep "linux_amd64" checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep "linux_arm64" checksums.txt | awk '{print $1}')

          # Generate Formula
          cat > /tmp/gale.rb << EOF
          require_relative "../lib/private_strategy"

          class Gale < Formula
            desc "Self-hosted GitHub Actions runner manager with auto-scaling"
            homepage "https://github.com/manashmandal/gale"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/manashmandal/gale/releases/download/${TAG}/gale_${VERSION}_darwin_amd64.tar.gz", using: GitHubPrivateRepositoryDownloadStrategy
                sha256 "${SHA_DARWIN_AMD64}"
              end
              on_arm do
                url "https://github.com/manashmandal/gale/releases/download/${TAG}/gale_${VERSION}_darwin_arm64.tar.gz", using: GitHubPrivateRepositoryDownloadStrategy
                sha256 "${SHA_DARWIN_ARM64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/manashmandal/gale/releases/download/${TAG}/gale_${VERSION}_linux_amd64.tar.gz", using: GitHubPrivateRepositoryDownloadStrategy
                sha256 "${SHA_LINUX_AMD64}"
              end
              on_arm do
                url "https://github.com/manashmandal/gale/releases/download/${TAG}/gale_${VERSION}_linux_arm64.tar.gz", using: GitHubPrivateRepositoryDownloadStrategy
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "gale"
            end

            def caveats
              <<~EOS
                To get started:
                  gale init     # Interactive setup
                  gale start    # Start the autoscaler

                Note: This formula requires HOMEBREW_GITHUB_API_TOKEN to be set.
              EOS
            end

            test do
              system "#{bin}/gale", "version"
            end
          end
          EOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' /tmp/gale.rb

          # Get current SHA and update Formula
          CURRENT_SHA=$(curl -sL "https://api.github.com/repos/manashmandal/homebrew-tap/contents/Formula/gale.rb" \
            -H "Authorization: token $GITHUB_TOKEN" | jq -r '.sha')

          curl -sL -X PUT "https://api.github.com/repos/manashmandal/homebrew-tap/contents/Formula/gale.rb" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"feat: update gale to ${TAG}\", \"content\": \"$(base64 -w0 /tmp/gale.rb)\", \"sha\": \"${CURRENT_SHA}\"}"
