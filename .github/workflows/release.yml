name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release type (auto uses CalVer YYYY.MM.DD)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: gale
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate CalVer tag
        if: github.event_name == 'workflow_dispatch'
        id: calver
        run: |
          # Generate CalVer version: YYYY.MM.DD
          BASE_VERSION=$(date +%Y.%m.%d)

          # Check if this version already exists
          EXISTING=$(git tag -l "${BASE_VERSION}*" | sort -V | tail -1)

          if [ -z "$EXISTING" ]; then
            VERSION="${BASE_VERSION}"
          else
            # Extract patch number if exists (e.g., 2025.01.15.1 -> 1)
            PATCH=$(echo "$EXISTING" | sed "s/${BASE_VERSION}\.*//" | sed 's/^$/0/')
            if [ -z "$PATCH" ] || [ "$PATCH" = "$EXISTING" ]; then
              PATCH=0
            fi
            NEXT_PATCH=$((PATCH + 1))
            VERSION="${BASE_VERSION}.${NEXT_PATCH}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.calver.outputs.version }}" -m "Release ${{ steps.calver.outputs.version }}"
          git push origin "${{ steps.calver.outputs.version }}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
