name: Test Parallel Runners

on:
  workflow_dispatch:

jobs:
  parallel-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        job: [1, 2, 3, 4, 5]
    steps:
      - name: Job ${{ matrix.job }} on ${{ matrix.os }}
        run: |
          echo "Job ${{ matrix.job }} started at $(date)"
          echo "Runner: $RUNNER_NAME"
          echo "OS: ${{ matrix.os }}"
          sleep 10
          echo "Job ${{ matrix.job }} completed at $(date)"
