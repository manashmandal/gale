name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: gale
    timeout-minutes: 5
    steps:
      - name: Clone repository
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --depth 1 https://github.com/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA

      - name: Verify Go installation
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage check
        run: |
          script -q /dev/null go test -v -coverprofile=coverage.out ./internal/...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 65)}"; then
            echo "Coverage ${COVERAGE}% is below minimum 65%"
            exit 1
          fi

  lint:
    runs-on: gale
    timeout-minutes: 5
    needs: test
    steps:
      - name: Clone repository
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --depth 1 https://github.com/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA

      - name: Verify Go installation
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted:"
            gofmt -d .
            exit 1
          fi

  build:
    runs-on: gale
    timeout-minutes: 5
    needs: lint
    steps:
      - name: Clone repository
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --depth 1 https://github.com/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA

      - name: Verify Go installation
        run: go version

      - name: Build
        run: go build -v ./...
