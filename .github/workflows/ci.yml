name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: gale
    timeout-minutes: 5
    steps:
      - name: Clone repository
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --depth 1 https://github.com/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA

      - name: Verify Go installation
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage check
        id: test
        shell: bash
        run: |
          echo "Starting go test..."
          go test -v -coverprofile=coverage.out ./internal/... > test-output.txt 2>&1
          RESULT=$?
          echo "Go test completed with exit code: $RESULT"
          echo "test_result=$RESULT" >> $GITHUB_OUTPUT
          cat test-output.txt
          if [ $RESULT -ne 0 ]; then
            echo "Tests failed"
            exit 1
          fi
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 65)}"; then
            echo "Coverage ${COVERAGE}% is below minimum 65%"
            exit 1
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt

  lint:
    runs-on: gale
    timeout-minutes: 5
    needs: test
    steps:
      - name: Clone repository
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --depth 1 https://github.com/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA

      - name: Verify Go installation
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted:"
            gofmt -d .
            exit 1
          fi

  build:
    runs-on: gale
    timeout-minutes: 5
    needs: lint
    steps:
      - name: Clone repository
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --depth 1 https://github.com/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA

      - name: Verify Go installation
        run: go version

      - name: Build
        run: go build -v ./...
