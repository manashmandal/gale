version: 2

project_name: gale

before:
  hooks:
    - go mod tidy

builds:
  - id: gale
    main: ./cmd/gale
    binary: gale
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: gale
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

changelog:
  use: github-native

release:
  github:
    owner: manashmandal
    name: gale
  draft: false
  prerelease: auto
  make_latest: true
  name_template: "Release {{.Tag}}"
