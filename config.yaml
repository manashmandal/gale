# Gale Configuration
# Documentation: https://github.com/manashmandal/gale

github:
    token: ${GITHUB_TOKEN}
    owner: manashmandal
    repo: test-gale
    repos:
        - test-gale
        - gale
    scope: repo
    app:
        app_id: 0
        private_key_path: ""
        private_key: ""
        webhook_secret: ""
docker:
    host: unix:///var/run/docker.sock
    api_version: ""
scaler:
    min_runners: 0
    max_runners: 10
    poll_interval: 10s
    scale_up_delay: 5s
    rate_limit_threshold: 2500
runner:
    image: myoung34/github-runner:latest
    labels:
        - gale
        - self-hosted
        - linux
        - x64
        - docker
    env: {}
    network_mode: ""
webhook:
    port: 8080
    secret: ""
log_level: info
