# Gale - JIT GitHub Actions Runner Autoscaler
# Configuration file

github:
  # GitHub Personal Access Token (requires 'repo' scope)
  # Can also be set via GITHUB_TOKEN environment variable
  token: ${GITHUB_TOKEN}

  # Repository owner (user or organization)
  owner: ${GITHUB_OWNER}

  # Repository name
  repo: ${GITHUB_REPO}

docker:
  # Docker host (default: unix:///var/run/docker.sock)
  host: ""

scaler:
  # Minimum number of runners to keep running
  min_runners: 0

  # Maximum number of runners to scale up to
  max_runners: 10

  # How often to check for queued jobs
  poll_interval: 10s

  # Minimum delay between scale-up operations
  scale_up_delay: 5s

runner:
  # Docker image for runners
  image: myoung34/github-runner:latest

  # Labels for job matching
  labels:
    - self-hosted
    - linux
    - x64
    - docker

  # Additional environment variables for runners
  env: {}

  # Docker network mode (optional)
  network_mode: ""

# Log level: debug, info, warn, error
log_level: info
